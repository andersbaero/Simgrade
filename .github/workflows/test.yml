name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # All three platforms, because the release workflow builds on Windows and
    # macOS and a tag is a bad place to discover a platform-specific failure.
    # v1.6.0 was tagged with a Windows-only parse error that every ubuntu run
    # had passed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
          cache: npm

      - run: npm ci

      # The sim binaries and item database are ~56 MB and pinned by
      # data/release.json, so they only need fetching when that pin moves.
      - uses: actions/cache@v4
        with:
          path: |
            bin
            data/db.json
          key: wowsims-${{ runner.os }}-${{ hashFiles('data/release.json') }}

      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
